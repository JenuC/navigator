[project]
name = "navigator"
version = "0.1.0"
description = "XY(Z) Stage Navigator GUI"
requires-python = ">=3.10"
dependencies = [
    "imgui-bundle>=1.5.0",
]

[project.scripts]
navigator = "navigator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]
