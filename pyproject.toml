[project]
name = "navigator"
version = "0.1.0"
description = "XY(Z) Stage Navigator GUI"
requires-python = ">=3.10"
dependencies = [
    "imgui-bundle>=1.5.0",
    "ipython>=8.39.0",
    "pycromanager>=1.0.2",
    "PyOpenGL>=3.1.0",
]

[project.optional-dependencies]
# Real hardware via Micro-Manager 2 + pycromanager bridge.
# Install: uv pip install -e ".[hardware]"
# Also installs microscope_control from the bundled submodule.
hardware = [
    "pycromanager>=0.13.0",
]
# BH SPC-180NX via pybhspc submodule.
# Install: uv pip install -e ".[spc]"
# Also requires SPCM-DLL from the BH SPCM software installation.
spc = [
    "bh_spc @ ./pybhspc",
    "numpy>=1.24",
]

[project.scripts]
navigator = "navigator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]
